<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            background-color: salmon;

            display: flex;
            flex-flow: row wrap;
        }
        div.iten{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="iten">exemplo de bloco A</div>
        <div class="iten">exemplo de bloco B</div>
        <div class="iten">exemplo de bloco C</div>
        <div class="iten">exemplo de bloco D</div>
        <div class="iten">exemplo de bloco E</div>
        <div class="iten">exemplo de bloco F</div>
        <div class="iten">exemplo de bloco G</div>
    </div>
</body>
</html>
