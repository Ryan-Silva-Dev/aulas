<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container{
            background-color: salmon;

            display: flex;
            flex-direction: row;
        }
        div.iten{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        div>img{
            width:500px;
            height:300px;
            display: block;
            margin: auto;
            padding-top:200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="iten">A</div>
        <div class="iten">B</div>
        <div class="iten">C</div>
        <div class="iten">D</div>
        <div class="iten">E</div>
        <div class="iten">F</div>
        <div class="iten">G</div>
    </div>
    <div><img src="eixos.png" alt=""></div>
</body>
</html>
